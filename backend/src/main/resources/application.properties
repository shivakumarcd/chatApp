spring.application.name=collabchat
server.forward-headers-strategy=native

# Database
spring.datasource.url=jdbc:mysql://mysql:3306/collabchat_db
spring.datasource.username=collabuser
spring.datasource.password=collabpass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
#To automatically create and update tables based on entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

file.upload-dir=/app/uploads/

# Allow larger file uploads
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
