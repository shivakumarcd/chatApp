
# Per-directive explanatory comments added. Each comment explains what the directive tells nginx to do
# and why it's present in this project (reverse-proxying the Spring Boot app, enforcing TLS, and preserving client info).

server {
    # Listen for incoming plain HTTP connections on port 80 (host port 80 mapped by docker-compose).
    # Larger picture: accept unencrypted requests and redirect them to HTTPS so all traffic is encrypted.
    listen 80;

    # Limit this server block to requests using the Host header "localhost".
    # Larger picture: ensures the virtual host handles only traffic targeted at the local development hostname.
    server_name localhost;

    # Immediately redirect all HTTP requests to the equivalent HTTPS URL using a 301 permanent redirect.
    # Larger picture: enforces TLS for all clients and simplifies backend (backend only needs to serve HTTP internally).
    return 301 https://$host$request_uri;
}

server {
    # Accept TLS/SSL connections on port 443 (the standard HTTPS port).
    # Larger picture: this server block is the TLS front-end that terminates TLS for incoming traffic.
    listen 443 ssl;

    # Only handle requests addressed to 'localhost'. Keeps server_name consistent with the HTTP block above.
    server_name localhost;

    # Path inside the container to the TLS certificate chain (certificate + intermediates).
    # Larger picture: presented to clients during TLS handshake so browsers can validate the server identity.
    ssl_certificate /etc/nginx/certs/fullchain.pem;

    # Path inside the container to the unencrypted private key corresponding to the certificate.
    # Larger picture: used by nginx to complete the TLS handshake and decrypt incoming traffic.
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Security: explicitly allow only modern, secure TLS protocol versions.
    # Larger picture: reduces attack surface by disabling old, insecure TLS/SSL versions.
    ssl_protocols TLSv1.2 TLSv1.3;

    # Security: prefer strong cipher suites and exclude weak or anonymous ciphers.
    # Larger picture: enforces reasonably strong cryptography for development/demo use.
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Route all requests with path prefix "/" to the backend application running on the Docker network.
    # Larger picture: nginx acts as a reverse proxy; it accepts external HTTPS connections and forwards them to the app.
    location / {
        # Upstream target: the Docker Compose service named "app" reachable via Docker network DNS at port 8080.
        # Larger picture: connects HTTPS front-end to the Spring Boot app (which listens on HTTP 8080 inside its container).
        proxy_pass http://app:8080;

        # Forward the original Host header from the client to the backend.
        # Larger picture: preserves the original Host so the backend can make decisions or generate URLs based on it.
        proxy_set_header Host $host;

        # Forward the client's IP address in a simple header so the backend can see the originating IP.
        # Larger picture: useful for logging, rate-limiting, and auditing on the application side.
        proxy_set_header X-Real-IP $remote_addr;

        # Append the client's IP to the X-Forwarded-For chain (preserves previous proxy hops if any).
        # Larger picture: keeps the full proxy chain so downstream services can reconstruct the client's route.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Tell the backend that the original request used HTTPS.
        # Larger picture: backend can use this to build correct absolute URLs, set secure cookies, or redirect logic.
        proxy_set_header X-Forwarded-Proto https;

        # Alternative: use the $scheme variable to pass the actual scheme (http/https) instead of hardcoding.
        # proxy_set_header X-Forwarded-Proto $scheme;

        # The lines below are commented out but show common tweaks when proxying (e.g., for websockets or connection handling):
        # proxy_http_version 1.1;           # Use HTTP/1.1 to support features like chunked transfer or websockets.
        # proxy_set_header Connection ""; # Clear or manage Connection header when using keepalive/upstream.
    }
}